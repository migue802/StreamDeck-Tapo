<!DOCTYPE html>
<html>

<head lang="en">
    <title>White</title>
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
    <script src="tapo-hash.js"></script>
    <script src="connection.js"></script>
    <link rel="stylesheet" href="tapo.css" />
</head>

<body>
    <sdpi-item label="Temperature">
        <sdpi-range setting="kelvin" min="2500" max="9000" step="100" default="4000" showlabels></sdpi-range>

    <sdpi-item label="Dial step">
        <sdpi-range setting="step" min="50" max="500" step="50" default="100" showlabels></sdpi-range>
    </sdpi-item>

    <tapo-connection></tapo-connection>
</body>

</html>
